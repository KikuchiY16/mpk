name: vote
# スプレッドシートの買い注文 (ipat_orders タブ) を拾って、即PATで購入する。
# 予測・判定はこのリポジトリに無い。判定側(自宅PCなど)が注文を書き込む (vote/order_queue.py の enqueue)。
# 購入モードは off(既定) / dry_run / live。定期実行ではリポジトリ変数 IPAT_MODE を使う
# (Settings > Secrets and variables > Actions > Variables)。未設定なら off。手動実行では入力欄で選ぶ。
# まず手動で dry_run を流して、Actionsのランナーから即PATにログインできるかを確認すること。
on:
  schedule:
    - cron: "30 23 * * *"
    - cron: "50 23 * * *"
    - cron: "10 0 * * *"
    - cron: "30 0 * * *"
    - cron: "50 0 * * *"
    - cron: "0 3 * * *"
    - cron: "20 3 * * *"
    - cron: "40 3 * * *"
    - cron: "0 4 * * *"
    - cron: "20 4 * * *"
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      ipat:
        description: "IPAT: off=何もしない / dry_run=購入確認画面で停止 / live=実購入"
        type: choice
        options: ["off", "dry_run", "live"]
        default: "off"
      until:
        description: "HH:MM で終了 (空なら下の既定)"
        required: false
        default: ""
concurrency:
  group: vote
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Asia/Tokyo
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      ORDERS_SHEET_ID: ${{ secrets.ORDERS_SHEET_ID }}
      PURCHASE_STORE: sheet
      IPAT_INET_ID: ${{ secrets.IPAT_INET_ID }}
      IPAT_SUBSCRIBER_NO: ${{ secrets.IPAT_SUBSCRIBER_NO }}
      IPAT_PIN: ${{ secrets.IPAT_PIN }}
      IPAT_PARS: ${{ secrets.IPAT_PARS }}
      IPAT_MODE: ${{ inputs.ipat || vars.IPAT_MODE || 'off' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Playwright
        if: ${{ env.IPAT_MODE != 'off' }}
        run: pip install playwright
      - uses: actions/cache@v4
        if: ${{ env.IPAT_MODE != 'off' }}
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-v1
      - name: Chromium
        if: ${{ env.IPAT_MODE != 'off' }}
        run: python -m playwright install --with-deps chromium
      - name: 注文を処理
        env:
          IN_UNTIL: ${{ inputs.until }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          UNTIL="$IN_UNTIL"
          if [ "$EVENT" = "schedule" ]; then
            case "$CRON" in
              *" 23 * * *"|*" 0 * * *") UNTIL="12:50" ;;
              *) UNTIL="16:50" ;;
            esac
          fi
          ARGS=""
          [ -n "$UNTIL" ] && ARGS="--until $UNTIL"
          PYTHONPATH=. python -u -m vote.run_orders $ARGS
