name: probe
# 最初に1回だけ手動で流す: ランナーのIPから Yahoo / Netkeiba / YouTube に繋がるかを確認する。
on:
  workflow_dispatch:
    inputs:
      netkeiba_race_id:
        description: "Netkeiba形式のrace_id(12桁)。空なら既定のサンプル"
        required: false
        default: ""
      horse_id:
        description: "Netkeibaのhorse_id。空なら既定のサンプル"
        required: false
        default: ""
      youtube_video_id:
        description: "ライブ配信中の動画ID。空なら既定のサンプル"
        required: false
        default: ""
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: probe
        env:
          RID: ${{ inputs.netkeiba_race_id }}
          HID: ${{ inputs.horse_id }}
          VID: ${{ inputs.youtube_video_id }}
        run: python -m monitor.probe $RID $HID $VID
