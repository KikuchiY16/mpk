name: monitor
# 毎日、午前・午後に20分おきで起動を仕掛ける(開催日でなければ、または既に終わっていれば数十秒で終了)。
# cronは遅延したり抜けたりするので、起動後は run_day が自分でループして各レースの発走15分前・5分前に判定する。
# 6時間制限があるので午前/午後に分割。同時には1つだけ動き(concurrency)、後から来た起動は待つ。
on:
  schedule:
    - cron: "30 23 * * *"
    - cron: "50 23 * * *"
    - cron: "10 0 * * *"
    - cron: "30 0 * * *"
    - cron: "50 0 * * *"
    - cron: "0 3 * * *"
    - cron: "20 3 * * *"
    - cron: "40 3 * * *"
    - cron: "0 4 * * *"
    - cron: "20 4 * * *"
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD(空なら今日)"
        required: false
        default: ""
      dry_run:
        description: "シートに書かない"
        type: boolean
        default: true
      min_racenum:
        description: "このレース番号以上だけ監視"
        required: false
        default: "1"
      until:
        description: "HH:MM で終了(空なら最終レースまで)"
        required: false
        default: ""
      youtube_video_id:
        description: "YouTube配信の動画ID(空なら使わない)"
        required: false
        default: ""
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Asia/Tokyo
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      YOUTUBE_VIDEO_ID: ${{ inputs.youtube_video_id || vars.YOUTUBE_VIDEO_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run
        env:
          IN_DATE: ${{ inputs.date }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_MIN: ${{ inputs.min_racenum }}
          IN_UNTIL: ${{ inputs.until }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ -z "$YOUTUBE_VIDEO_ID" ]; then
            D="${IN_DATE:-$(date +%F)}"
            case "$D" in
              2026-10-31) export YOUTUBE_VIDEO_ID=eKmAAki7N6c ;;
              2026-11-01) export YOUTUBE_VIDEO_ID=MHOpP89yqUQ ;;
            esac
          fi
          ARGS="--min_racenum ${IN_MIN:-1}"
          [ -n "$IN_DATE" ] && ARGS="$ARGS --date $IN_DATE"
          if [ "$EVENT" = "schedule" ]; then
            # cron の UTC 時刻が 午前(23時台〜0時台)なら 12:50 まで、午後なら最終レースまで
            case "$CRON" in
              *" 23 * * *"|*" 0 * * *") ARGS="$ARGS --until 12:50" ;;
            esac
          else
            [ -n "$IN_UNTIL" ] && ARGS="$ARGS --until $IN_UNTIL"
            [ "$IN_DRY" = "true" ] && ARGS="$ARGS --dry_run"
          fi
          python -u -m monitor.run_day $ARGS
